# Fabrique l'audio des épisodes validés, puis met à jour la liste et le flux RSS.
# Se lance tout seul quand un texte de podcast/scripts/ arrive ou change sur la branche principale
# (par exemple en acceptant une proposition de relecture).
name: "Podcast : publier"

on:
  push:
    paths:
      - "podcast/scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  publier:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer
        run: pip install -r podcast/requirements.txt

      - name: Enregistrer les épisodes
        run: python podcast/generate.py enregistrer

      - name: Mettre en ligne
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Podcast : audio et flux mis à jour"
            git pull --rebase
            git push
          fi
